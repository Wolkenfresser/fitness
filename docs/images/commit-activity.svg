<svg width="700" height="180" viewBox="0 0 700 180" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="700" height="180" rx="12" fill="#1A1A1A"/>
  <text x="24" y="28" fill="#F0F0F0" font-size="13" font-weight="700">График активности коммитов</text>
  <text x="24" y="44" fill="#888" font-size="10">Последние 12 недель · 87 коммитов</text>
  <!-- axes -->
  <line x1="60" y1="140" x2="680" y2="140" stroke="#333" stroke-width="1"/>
  <line x1="60" y1="55" x2="60" y2="140" stroke="#333" stroke-width="1"/>
  <!-- y labels -->
  <text x="50" y="143" fill="#555" font-size="9" text-anchor="end">0</text>
  <text x="50" y="118" fill="#555" font-size="9" text-anchor="end">5</text>
  <text x="50" y="93" fill="#555" font-size="9" text-anchor="end">10</text>
  <text x="50" y="68" fill="#555" font-size="9" text-anchor="end">15</text>
  <line x1="60" y1="115" x2="680" y2="115" stroke="#222" stroke-width="0.5" stroke-dasharray="3,4"/>
  <line x1="60" y1="90" x2="680" y2="90" stroke="#222" stroke-width="0.5" stroke-dasharray="3,4"/>
  <line x1="60" y1="65" x2="680" y2="65" stroke="#222" stroke-width="0.5" stroke-dasharray="3,4"/>
  <!-- Area fill -->
  <defs>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8FF00" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C8FF00" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <!-- data: weeks with commit counts mapped to y (max=15 → y=65) -->
  <!-- points: x spacing = (680-60)/11 = ~56 per week -->
  <!-- commits: 2,3,5,4,8,6,12,9,14,10,7,7 -->
  <polygon
    points="60,131 116,126 172,113 228,120 284,99 340,107 396,75 452,89 508,69 564,83 620,96 676,96 676,140 60,140"
    fill="url(#areaGrad)"
  />
  <polyline
    points="60,131 116,126 172,113 228,120 284,99 340,107 396,75 452,89 508,69 564,83 620,96 676,96"
    fill="none" stroke="#C8FF00" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"
  />
  <!-- dots -->
  <circle cx="60" cy="131" r="3.5" fill="#C8FF00"/>
  <circle cx="116" cy="126" r="3.5" fill="#C8FF00"/>
  <circle cx="172" cy="113" r="3.5" fill="#C8FF00"/>
  <circle cx="228" cy="120" r="3.5" fill="#C8FF00"/>
  <circle cx="284" cy="99" r="3.5" fill="#C8FF00"/>
  <circle cx="340" cy="107" r="3.5" fill="#C8FF00"/>
  <circle cx="396" cy="75" r="5" fill="#C8FF00" stroke="#0D0D0D" stroke-width="2"/>
  <circle cx="452" cy="89" r="3.5" fill="#C8FF00"/>
  <circle cx="508" cy="69" r="5" fill="#C8FF00" stroke="#0D0D0D" stroke-width="2"/>
  <circle cx="564" cy="83" r="3.5" fill="#C8FF00"/>
  <circle cx="620" cy="96" r="3.5" fill="#C8FF00"/>
  <circle cx="676" cy="96" r="3.5" fill="#C8FF00"/>
  <!-- peak label -->
  <rect x="490" y="52" width="54" height="18" rx="4" fill="#C8FF00"/>
  <text x="517" y="64" fill="#0D0D0D" font-size="9" font-weight="700" text-anchor="middle">🏆 14 ком.</text>
  <line x1="517" y1="70" x2="517" y2="69" stroke="#C8FF00" stroke-width="1"/>
  <!-- x-axis labels -->
  <text x="60" y="155" fill="#555" font-size="9" text-anchor="middle">Н1</text>
  <text x="116" y="155" fill="#555" font-size="9" text-anchor="middle">Н2</text>
  <text x="172" y="155" fill="#555" font-size="9" text-anchor="middle">Н3</text>
  <text x="228" y="555" fill="#555" font-size="9" text-anchor="middle">Н4</text>
  <text x="228" y="155" fill="#555" font-size="9" text-anchor="middle">Н4</text>
  <text x="284" y="155" fill="#555" font-size="9" text-anchor="middle">Н5</text>
  <text x="340" y="155" fill="#555" font-size="9" text-anchor="middle">Н6</text>
  <text x="396" y="155" fill="#C8FF00" font-size="9" font-weight="700" text-anchor="middle">Н7</text>
  <text x="452" y="155" fill="#555" font-size="9" text-anchor="middle">Н8</text>
  <text x="508" y="155" fill="#C8FF00" font-size="9" font-weight="700" text-anchor="middle">Н9</text>
  <text x="564" y="155" fill="#555" font-size="9" text-anchor="middle">Н10</text>
  <text x="620" y="155" fill="#555" font-size="9" text-anchor="middle">Н11</text>
  <text x="676" y="155" fill="#555" font-size="9" text-anchor="middle">Н12</text>
  <!-- stats pills -->
  <rect x="24" y="160" width="80" height="14" rx="7" fill="#C8FF0018"/>
  <text x="64" y="170" fill="#C8FF00" font-size="9" font-weight="600" text-anchor="middle">87 коммитов</text>
  <rect x="112" y="160" width="88" height="14" rx="7" fill="#4D9FFF18"/>
  <text x="156" y="170" fill="#4D9FFF" font-size="9" font-weight="600" text-anchor="middle">12 недель активно</text>
  <rect x="208" y="160" width="88" height="14" rx="7" fill="#FF8C4D18"/>
  <text x="252" y="170" fill="#FF8C4D" font-size="9" font-weight="600" text-anchor="middle">7.25 ком. / нед.</text>
</svg>
